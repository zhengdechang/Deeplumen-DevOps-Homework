apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: production  # RoleBinding 所在的命名空间
  name: jenkins-deploy-binding
subjects:
  - kind: ServiceAccount
    name: jenkins-deployer
    namespace: jenkins  # SA 所在的固定命名空间
roleRef:
  kind: Role
  name: jenkins-deploy-role
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: staging  # RoleBinding 所在的命名空间
  name: jenkins-deploy-binding
subjects:
  - kind: ServiceAccount
    name: jenkins-deployer
    namespace: jenkins  # SA 所在的固定命名空间
roleRef:
  kind: Role
  name: jenkins-deploy-role
  apiGroup: rbac.authorization.k8s.io